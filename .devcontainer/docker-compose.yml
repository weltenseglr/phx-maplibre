services:
  app:
    init: true
    # Docker's default namespace is compatible with the host checkout. Rootless
    # Podman must use keep-id so the non-root `vscode` user can read and write it.
    userns_mode: ${DEVCONTAINER_USERNS_MODE:-host}
    build:
      # podman-compose reports relative contexts unchanged; the devcontainer
      # CLI needs an absolute one in CI. Local Docker/Podman keep `..`.
      context: ${DEVCONTAINER_BUILD_CONTEXT:-..}
      dockerfile: .devcontainer/Dockerfile
    image: phx-maplibre-dev:latest
    ports:
      - "${DEMO_PORT:-4001}:${DEMO_PORT:-4001}"
      - "${GSD_PORT:-4002}:${GSD_PORT:-4002}"
    volumes:
      # :z gives the checkout a shared Podman SELinux label. Docker ignores
      # it, while the shared label lets either runtime use the same checkout
      # without fighting over private :Z MCS labels.
      - ..:/workspace:z
      - phx_build:/workspace/_build
      - ${HOME}/.config/opencode:/root/.config/opencode
      - ${HOME}/.local/share/opencode/auth.json:/root/.local/share/opencode/auth.json
    working_dir: /workspace
    environment:
      MIX_ENV: dev
      DATABASE_URL: ecto://postgres:postgres@postgres:5432/phx_maplibre_dev
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: phx_maplibre_dev
      # Keep endpoint and published host ports aligned. This permits Docker and
      # Podman devcontainers to run concurrently with different port pairs.
      DEMO_PORT: ${DEMO_PORT:-4001}
      GSD_PORT: ${GSD_PORT:-4002}
    depends_on:
      postgres:
        condition: service_healthy
    # The image starts as root, but every devcontainer command runs as `vscode`.
    # Initialize the disposable build-cache volume once so both Docker and
    # rootless Podman can write it as that user.
    command: >-
      /bin/sh -c 'chown -R vscode:vscode /workspace/_build && exec sleep infinity'

  postgres:
    # postgis/postgis publishes amd64 only (README: "Supported architecture: amd64").
    # Its CI already builds arm64 on native runners but gates the push to the amd64 job
    # until the digest-push + manifest-merge rollout lands — tracked in
    # https://github.com/postgis/docker-postgis/pull/432 (and #448).
    # imresamu/postgis is the same maintainer's multi-arch build from the same
    # Dockerfiles; swap back to postgis/postgis:18-3.6-alpine once #432 ships.
    image: imresamu/postgis:18-3.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phx_maplibre_dev
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  phx_build:
